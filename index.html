<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Jelly Family · 戳一戳果冻一家</title>
<meta name="description" content="Poke, stretch and fling a family of squishy jelly blobs. 一家五口的 Q 弹小果冻，拖一拖、戳一戳、看它们一起跳。">
<meta property="og:title" content="Jelly Family · 戳一戳果冻一家">
<meta property="og:description" content="Poke, stretch and fling a family of squishy jelly blobs. 一家五口的 Q 弹小果冻，拖一拖、戳一戳、看它们一起跳。">
<meta property="og:image" content="https://gerryke.github.io/jelly-poc/share.png">
<meta property="og:url" content="https://gerryke.github.io/jelly-poc/">
<meta property="og:type" content="website">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #FFF6E8; overflow: hidden; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hint { position: fixed; top: 24px; width: 100%; text-align: center; color: #9A8878;
          font: 15px -apple-system, "PingFang SC", sans-serif; pointer-events: none; transition: opacity 1s; }
  #envbar { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom)); width: 100%; display: flex; flex-direction: column;
            align-items: center; gap: 8px; font: 13px -apple-system, "PingFang SC", sans-serif; pointer-events: none; }
  #envlabel { color: rgba(70, 60, 50, 0.6); }
  #wx { pointer-events: auto; border: 0; border-radius: 999px; padding: 7px 14px; font: inherit; color: #6B5D50;
        background: rgba(255, 255, 255, 0.7); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08); }
</style>
</head>
<body>
<img src="share.png" alt="" width="600" height="600" style="position:absolute;width:0;height:0;opacity:0;pointer-events:none">
<canvas id="c"></canvas>
<div id="hint"></div>
<div id="envbar"><div id="envlabel"></div><button id="wx"></button></div>
<script>
// 网页版原型：一圈 Verlet 质点 + 边长约束 + 内部气压 + 形状回弹（shape matching）
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, floorY = 0, world = {};
const STEP = 1 / 120, G = 1700;
let tilt = 0;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  floorY = H * 0.85;
  world = { minX: 6, maxX: W - 6, minY: 20, maxY: floorY };
}
addEventListener('resize', resize);
resize();

// ---- 真实四季与昼夜（基础层，无需任何权限）+ 真实天气（增强层，玩家授权大致位置才有）----
// 预览参数：?month=1-12 &hour=0-23 &hemi=s &weather=clear|cloudy|rain|storm|snow|fog|wind &temp=摄氏度
const Q = new URLSearchParams(location.search);

// 界面文案：中文系统显示中文，其余显示英文；?lang=zh|en 可强制
const LANG = Q.get('lang') || ((navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en');
const FAHRENHEIT = LANG === 'en' && /-US$/i.test(navigator.language || '');
const T = {
  zh: {
    hintMouse: '拖一拖 · 点一下戳它 · 点空白处一起跳 · ← → 倾斜 · 空格跳', hintTouch: '拖一拖 · 戳一戳 · 点空白处一起跳',
    north: '北半球', south: '南半球', sep: ' · ', windy: '有风',
    seasons: { spring: '春天', summer: '夏天', autumn: '秋天', winter: '冬天' },
    phases: { dawn: '清晨', day: '白天', dusk: '傍晚', night: '夜晚' },
    weather: { clear: '晴', cloudy: '多云', fog: '有雾', rain: '下雨', storm: '雷雨', snow: '下雪' },
    wx: '☁️ 同步我那里的天气', wxBusy: '正在获取…', wxNoGeo: '这个浏览器拿不到位置',
    wxFail: '没拿到天气，稍后再试', wxDenied: '没有位置也没关系，四季和昼夜照样同步',
  },
  en: {
    hintMouse: 'Drag · Click to poke · Click empty space to hop · ← → tilt · Space to jump', hintTouch: 'Drag · Poke · Tap empty space to hop',
    north: 'Northern Hemisphere', south: 'Southern Hemisphere', sep: ' · ', windy: ', windy',
    seasons: { spring: 'Spring', summer: 'Summer', autumn: 'Autumn', winter: 'Winter' },
    phases: { dawn: 'Morning', day: 'Day', dusk: 'Evening', night: 'Night' },
    weather: { clear: 'Clear', cloudy: 'Cloudy', fog: 'Foggy', rain: 'Rain', storm: 'Thunderstorm', snow: 'Snow' },
    wx: '☁️ Sync with my local weather', wxBusy: 'Getting your location…', wxNoGeo: "This browser can't share location",
    wxFail: "Couldn't get the weather, try again later", wxDenied: 'No location, no problem: seasons and day/night still match yours',
  },
}[LANG];
document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
document.getElementById('hint').textContent = matchMedia('(pointer: coarse)').matches ? T.hintTouch : T.hintMouse;
document.getElementById('wx').textContent = T.wx;
const hex = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const mixRGB = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const rgb = (c, a = 1) => `rgba(${c.map(Math.round).join(',')},${a})`;
const clamp01 = v => Math.max(0, Math.min(1, v));

const SOUTH_TZ = /^(Australia|Antarctica)\/|^Pacific\/(Auckland|Chatham|Fiji|Tongatapu|Noumea|Efate)|^America\/(Argentina|Santiago|Montevideo|Asuncion|Sao_Paulo|Punta_Arenas)|^Africa\/(Johannesburg|Maputo|Harare|Windhoek|Gaborone|Maseru|Mbabane|Lusaka)|^Indian\/(Mauritius|Reunion)/;

const env = {
  south: Q.get('hemi') === 's' || (!Q.has('hemi') && SOUTH_TZ.test(Intl.DateTimeFormat().resolvedOptions().timeZone || '')),
  weather: Q.get('weather') === 'wind' ? 'clear' : Q.get('weather'),  // null = 没有真实天气
  wind: Q.get('weather') === 'wind' ? 1 : 0,
  temp: Q.has('temp') ? +Q.get('temp') : null,
  hour() { if (Q.has('hour')) return +Q.get('hour'); const d = new Date(); return d.getHours() + d.getMinutes() / 60; },
  season() {
    let m = Q.has('month') ? +Q.get('month') : new Date().getMonth() + 1;
    if (this.south) m = (m + 5) % 12 + 1;  // 南半球季节相反
    return m <= 2 || m === 12 ? 'winter' : m <= 5 ? 'spring' : m <= 8 ? 'summer' : 'autumn';
  },
  night() { const h = this.hour(); return h < 5 ? 1 : h < 6.5 ? 1 - (h - 5) / 1.5 : h < 17.5 ? 0 : h < 19.5 ? (h - 17.5) / 2 : 1; },
  glow() { const h = this.hour(); return Math.max(0, 1 - Math.abs(h - 6.2) / 1.3, 1 - Math.abs(h - 18.3) / 1.3); },
  phase() { const h = this.hour(); return this.night() > 0.6 ? 'night' : h < 9 ? 'dawn' : h >= 16.5 ? 'dusk' : 'day'; },
  wet() { return ['rain', 'storm', 'snow'].includes(this.weather); },
  // 冷了更紧更 Q，热了软塌塌
  stiffness() { return this.temp == null ? 1 : this.temp >= 30 ? 0.5 : this.temp <= 0 ? 1.7 : 1; },
};
const windNow = t => env.wind * (0.6 + 0.4 * Math.sin(t * 0.7) + 0.3 * Math.sin(t * 2.3));

const SKY_DAY = { spring: '#FFF6E8', summer: '#FFF1D6', autumn: '#FBEAD6', winter: '#EEF2F5' };
const GROUND = { spring: ['#C8E6B0', '#A9D38C'], summer: ['#A8D98A', '#8CC46C'], autumn: ['#E2C98E', '#C9AC6A'], winter: ['#F4F7F9', '#DCE4EA'] };
const NIGHT = hex('#1C2444');
const stars = Array.from({ length: 40 }, () => [Math.random(), Math.random() * 0.6, Math.random() * 1.2 + 0.4, Math.random() * 6]);

function drawSky(t) {
  const n = env.night(), g = env.glow();
  let day = hex(SKY_DAY[env.season()]);
  if (env.weather && env.weather !== 'clear') day = mixRGB(day, hex('#D6DADF'), env.weather === 'cloudy' ? 0.35 : 0.6);
  const top = mixRGB(mixRGB(day, hex('#F6B48F'), g * 0.5), NIGHT, n);
  const bottom = mixRGB(mixRGB(day, hex('#FBD3B5'), g * 0.6), hex('#2B3560'), n);
  const grad = ctx.createLinearGradient(0, 0, 0, floorY);
  grad.addColorStop(0, rgb(top)); grad.addColorStop(1, rgb(bottom));
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  if (n < 0.05 || (env.weather && env.weather !== 'clear')) return;
  for (const [x, y, r, ph] of stars) {
    ctx.fillStyle = `rgba(255,250,230,${n * (0.55 + 0.45 * Math.sin(t * 1.5 + ph))})`;
    ctx.beginPath(); ctx.arc(x * W, y * floorY, r, 0, 7); ctx.fill();
  }
  // 弯月：亮圆再盖一个天色圆
  ctx.fillStyle = `rgba(255,244,210,${n})`; ctx.beginPath(); ctx.arc(W * 0.8, H * 0.12, 16, 0, 7); ctx.fill();
  ctx.fillStyle = rgb(top); ctx.beginPath(); ctx.arc(W * 0.8 + 7, H * 0.12 - 4, 14, 0, 7); ctx.fill();
}

const particles = [];
let particlesSeeded = false;
function wantParticles() {
  const s = env.season(), n = env.night(), w = env.weather, want = {};
  if (w === 'rain') want.rain = 70;
  if (w === 'storm') want.rain = 120;
  if (w === 'snow') want.snow = 90; else if (s === 'winter' && !w) want.snow = 35;
  if (s === 'spring' && !env.wet()) want.petal = 16;
  if (s === 'autumn' && !env.wet()) want.leaf = 12;
  if (s === 'summer' && n > 0.5 && !env.wet()) want.firefly = 14;
  return want;
}
function spawn(type, anywhere) {
  const p = { type, x: Math.random() * W, y: anywhere ? Math.random() * floorY : -10, ph: Math.random() * 6.28, rot: Math.random() * 6.28 };
  if (type === 'rain') { p.vy = 650 + Math.random() * 200; p.len = 10 + Math.random() * 6; }
  if (type === 'snow') { p.vy = 30 + Math.random() * 35; p.r = 1.5 + Math.random() * 2; }
  if (type === 'petal') { p.vy = 25 + Math.random() * 20; p.r = 3 + Math.random() * 2.5; p.c = Math.random() < 0.5 ? '#F7C6D3' : '#FBDDE5'; }
  if (type === 'leaf') { p.vy = 35 + Math.random() * 30; p.r = 5 + Math.random() * 3; p.c = ['#E59A55', '#D2733C', '#CFA43F'][Math.random() * 3 | 0]; }
  if (type === 'firefly') { p.y = floorY * (0.45 + Math.random() * 0.5); p.vy = 0; }
  particles.push(p);
}
function updateParticles(dt, t) {
  const want = wantParticles(), have = {};
  for (const p of particles) have[p.type] = (have[p.type] || 0) + 1;
  for (const type in want) for (let i = have[type] || 0; i < want[type]; i++) spawn(type, !particlesSeeded || type === 'firefly');
  particlesSeeded = true;
  const wind = windNow(t) * 160;
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    if (!want[p.type]) { particles.splice(i, 1); continue; }
    if (p.type === 'firefly') { p.x += Math.sin(t * 0.8 + p.ph) * 20 * dt; p.y += Math.cos(t * 0.6 + p.ph * 2) * 14 * dt; continue; }
    const sway = p.type === 'rain' ? 0 : Math.sin(t * 1.3 + p.ph) * (p.type === 'leaf' ? 40 : 18);
    p.x += (sway + wind * (p.type === 'rain' ? 0.6 : 1)) * dt; p.y += p.vy * dt; p.rot += dt * (p.type === 'leaf' ? 2 : 1);
    if (p.x < -20) p.x += W + 40; else if (p.x > W + 20) p.x -= W + 40;
    if (p.type === 'rain' || p.type === 'snow') {
      // 雨点打在身上砸出小坑，雪花落在头上积起来
      const b = blobs.find(b => Math.abs(b.cx - p.x) < b.r * 1.4 && Math.abs(b.cy - p.y) < b.r * 1.4 && b.contains(p.x, p.y));
      if (b) {
        if (p.type === 'rain') b.dent(p.x, p.y, 0.025); else b.snow = Math.min(1, b.snow + 0.03);
        particles.splice(i, 1); continue;
      }
    }
    if (p.y > floorY + (p.type === 'rain' ? 0 : 6)) particles.splice(i, 1);
  }
}
function drawParticles(t, glowing) {
  const wind = windNow(t) * 160;
  for (const p of particles) {
    if ((p.type === 'firefly') !== glowing) continue;
    if (p.type === 'rain') {
      ctx.strokeStyle = 'rgba(140,160,190,0.55)'; ctx.lineWidth = 1.2; ctx.beginPath();
      ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - wind * 0.012, p.y - p.len); ctx.stroke();
    } else if (p.type === 'snow') {
      ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    } else if (p.type === 'firefly') {
      // 叠加发光，暗处不会发灰
      const a = 0.35 + 0.65 * Math.max(0, Math.sin(t * 2 + p.ph));
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 9);
      g.addColorStop(0, `rgba(200,255,120,${a * 0.5})`); g.addColorStop(1, 'rgba(200,255,120,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, 9, 0, 7); ctx.fill();
      ctx.fillStyle = `rgba(245,255,190,${a})`; ctx.beginPath(); ctx.arc(p.x, p.y, 1.8, 0, 7); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    } else {
      ctx.fillStyle = p.c; ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r, p.r * 0.55, p.rot, 0, 7); ctx.fill();
    }
  }
}

let flashUntil = 0;
function drawOverlay(t) {
  const n = env.night();
  if (n > 0) { ctx.fillStyle = `rgba(18,24,58,${0.28 * n})`; ctx.fillRect(0, 0, W, H); }
  if (env.weather === 'fog') {
    ctx.fillStyle = 'rgba(236,238,241,0.38)'; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 3; i++) {
      const y = floorY * (0.35 + i * 0.22), x = ((t * (8 + i * 4)) % (W + 300)) - 300;
      ctx.fillStyle = 'rgba(245,246,248,0.45)'; ctx.beginPath(); ctx.ellipse(x + 150, y, 220, 26, 0, 0, 7); ctx.fill();
    }
  }
  if (env.weather === 'storm' && t > flashUntil + 3 && Math.random() < 0.004) flashUntil = t + 0.12;
  if (t < flashUntil) { ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fillRect(0, 0, W, H); }
}

const WMO = c => c === 0 ? 'clear' : c <= 3 ? 'cloudy' : c <= 48 ? 'fog' : (c <= 67 || (c >= 80 && c <= 82)) ? 'rain' : (c <= 77 || c === 85 || c === 86) ? 'snow' : 'storm';
const wxButton = document.getElementById('wx');
function updateEnvLabel() {
  let text = [env.south ? T.south : T.north, T.seasons[env.season()], T.phases[env.phase()]].join(T.sep);
  if (env.weather) {
    const temp = env.temp == null ? '' : FAHRENHEIT ? ` ${Math.round(env.temp * 9 / 5 + 32)}°F` : ` ${Math.round(env.temp)}°C`;
    text += `${T.sep}${T.weather[env.weather]}${env.wind > 0.3 ? T.windy : ''}${temp}`;
  }
  const label = document.getElementById('envlabel');
  label.textContent = text;
  const dark = env.night() > 0.5;
  label.style.color = dark ? 'rgba(230,225,240,0.7)' : 'rgba(70,60,50,0.6)';
  document.getElementById('hint').style.color = dark ? '#C9C3D8' : '#9A8878';
  wxButton.style.display = env.weather ? 'none' : '';
}
async function syncWeather(lat, lon) {
  // 只把保留一位小数的经纬度（约 10 公里精度）发给天气接口，不上传到其他地方
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(1)}&longitude=${lon.toFixed(1)}&current=weather_code,temperature_2m,wind_speed_10m`;
  const cur = (await (await fetch(url)).json()).current;
  env.weather = WMO(cur.weather_code);
  env.temp = cur.temperature_2m;
  env.wind = clamp01((cur.wind_speed_10m - 15) / 25);
  env.south = lat < 0;
  updateEnvLabel();
}
function loadSavedPlace() { try { return JSON.parse(localStorage.getItem('jelly-place')); } catch { return null; } }
wxButton.addEventListener('click', () => {
  if (!navigator.geolocation) { wxButton.textContent = T.wxNoGeo; return; }
  wxButton.textContent = T.wxBusy;
  navigator.geolocation.getCurrentPosition(async pos => {
    const place = { lat: +pos.coords.latitude.toFixed(1), lon: +pos.coords.longitude.toFixed(1) };
    try { localStorage.setItem('jelly-place', JSON.stringify(place)); } catch {}
    try { await syncWeather(place.lat, place.lon); track('weather-on'); }
    catch { wxButton.textContent = T.wxFail; }
  }, () => { wxButton.textContent = T.wxDenied; },
  { enableHighAccuracy: false, maximumAge: 3600e3, timeout: 15000 });
});
if (!Q.has('weather')) {
  const place = loadSavedPlace();
  if (place) syncWeather(place.lat, place.lon).catch(() => {});
  setInterval(() => { const p = loadSavedPlace(); if (p) syncWeather(p.lat, p.lon).catch(() => {}); }, 30 * 60e3);
}
updateEnvLabel();
setInterval(updateEnvLabel, 60e3);

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = c => Math.round(c * (1 - amt));
  return `rgb(${f(n >> 16 & 255)},${f(n >> 8 & 255)},${f(n & 255)})`;
}

class Blob {
  constructor(x, y, r, color, style = 'smooth', n = 32) {
    this.n = n; this.r = r; this.color = color; this.style = style;
    this.unit = []; this.pos = []; this.prev = [];
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2, f = restRadius(style, a);
      this.unit.push([Math.cos(a) * f, Math.sin(a) * f]);
      this.pos.push([x + Math.cos(a) * f * r, y + Math.sin(a) * f * r]);
      this.prev.push([x + Math.cos(a) * f * r, y + Math.sin(a) * f * r]);
    }
    // 轮廓的质点重心挪到原点，否则形状回弹会一直把它往一个方向推
    let mx = 0, my = 0;
    for (const u of this.unit) { mx += u[0]; my += u[1]; }
    for (const u of this.unit) { u[0] -= mx / n; u[1] -= my / n; }
    // 静止轮廓的边长和面积（非圆形也能被气压和边约束维持）
    this.restEdge = []; let area = 0;
    for (let i = 0; i < n; i++) {
      const a = this.unit[i], b = this.unit[(i + 1) % n];
      this.restEdge.push(Math.hypot(b[0] - a[0], b[1] - a[1]));
      area += a[0] * b[1] - a[1] * b[0];
    }
    this.restAreaUnit = area * 0.5;
    this.held = false;
    this.snow = 0;
    this.cx = x; this.cy = y; this.vx = 0; this.vy = 0;
    this.excitedUntil = 0; this.nextBlink = 0; this.blinkUntil = 0;
    this.grounded = false;
  }
  get restArea() { return this.restAreaUnit * this.r * this.r; }

  integrate(gx, gy) {
    const max = this.r * 0.5;
    for (let i = 0; i < this.n; i++) {
      const p = this.pos[i], q = this.prev[i];
      const damp = this.held ? 0.99 : 0.998;
      let vx = (p[0] - q[0]) * damp, vy = (p[1] - q[1]) * damp;
      const l = Math.hypot(vx, vy);
      if (l > max) { vx *= max / l; vy *= max / l; }
      q[0] = p[0]; q[1] = p[1];
      p[0] += vx + gx * STEP * STEP; p[1] += vy + gy * STEP * STEP;
    }
  }
  centroid() {
    let x = 0, y = 0;
    for (const p of this.pos) { x += p[0]; y += p[1]; }
    this.cx = x / this.n; this.cy = y / this.n;
  }
  solveShape(k) {
    this.centroid();
    let s = 0, c = 0;
    for (let i = 0; i < this.n; i++) {
      const u = this.unit[i], dx = this.pos[i][0] - this.cx, dy = this.pos[i][1] - this.cy;
      c += u[0] * dx + u[1] * dy; s += u[0] * dy - u[1] * dx;
    }
    const a = Math.atan2(s, c) * (this.held ? 1 : 0.97), ca = Math.cos(a), sa = Math.sin(a);
    for (let i = 0; i < this.n; i++) {
      const ux = this.unit[i][0] * this.r, uy = this.unit[i][1] * this.r;
      const gx = this.cx + ux * ca - uy * sa, gy = this.cy + ux * sa + uy * ca;
      this.pos[i][0] += (gx - this.pos[i][0]) * k;
      this.pos[i][1] += (gy - this.pos[i][1]) * k;
    }
  }
  solveEdges(k) {
    for (let i = 0; i < this.n; i++) {
      const rest = this.restEdge[i] * this.r;
      const a = this.pos[i], b = this.pos[(i + 1) % this.n];
      const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy);
      if (l < 1e-9) continue;
      const f = (l - rest) / l * 0.5 * k;
      a[0] += dx * f; a[1] += dy * f; b[0] -= dx * f; b[1] -= dy * f;
    }
  }
  solvePressure(k) {
    let area = 0, per = 0;
    for (let i = 0; i < this.n; i++) {
      const a = this.pos[i], b = this.pos[(i + 1) % this.n];
      area += a[0] * b[1] - a[1] * b[0];
      per += Math.hypot(b[0] - a[0], b[1] - a[1]);
    }
    area *= 0.5;
    const push = (this.restArea - area) / per * k;
    const old = this.pos.map(p => [p[0], p[1]]);
    for (let i = 0; i < this.n; i++) {
      const nx = old[(i + 1) % this.n], pv = old[(i + this.n - 1) % this.n];
      let tx = nx[0] - pv[0], ty = nx[1] - pv[1];
      const l = Math.hypot(tx, ty) || 1;
      this.pos[i][0] += ty / l * push; this.pos[i][1] += -tx / l * push;
    }
  }
  solveBounds() {
    for (const p of this.pos) {
      p[0] = Math.min(Math.max(p[0], world.minX), world.maxX);
      p[1] = Math.min(Math.max(p[1], world.minY), world.maxY);
    }
  }
  friction(amt) {
    for (let i = 0; i < this.n; i++) {
      const p = this.pos[i], q = this.prev[i];
      if (p[1] >= world.maxY - 0.5 || p[1] <= world.minY + 0.5) q[0] += (p[0] - q[0]) * amt;
      if (p[0] <= world.minX + 0.5 || p[0] >= world.maxX - 0.5) q[1] += (p[1] - q[1]) * amt;
    }
  }
  impulse(vx, vy) {
    for (const q of this.prev) { q[0] -= vx * STEP; q[1] -= vy * STEP; }
  }
  poke(x, y) {
    this.centroid();
    const reach = this.r * 0.9;
    for (const p of this.pos) {
      const d = Math.hypot(p[0] - x, p[1] - y);
      if (d >= reach) continue;
      const f = 1 - d / reach, dx = this.cx - p[0], dy = this.cy - p[1], l = Math.hypot(dx, dy) || 1;
      p[0] += dx / l * this.r * 0.35 * f; p[1] += dy / l * this.r * 0.35 * f;
    }
    const side = Math.max(-1, Math.min(1, (this.cx - x) / this.r));
    this.impulse(side * 260, -760);
  }
  dent(x, y, amt) {
    let k = 0, best = Infinity;
    this.pos.forEach((p, i) => { const d = Math.hypot(p[0] - x, p[1] - y); if (d < best) { best = d; k = i; } });
    for (const [d, w] of [[0, 1], [-1, 0.5], [1, 0.5]]) {
      const p = this.pos[(k + d + this.n) % this.n], dx = this.cx - p[0], dy = this.cy - p[1], l = Math.hypot(dx, dy) || 1;
      p[0] += dx / l * this.r * amt * w; p[1] += dy / l * this.r * amt * w;
    }
  }
  contains(x, y) {
    let inside = false;
    for (let i = 0, j = this.n - 1; i < this.n; j = i++) {
      const a = this.pos[i], b = this.pos[j];
      if ((a[1] > y) !== (b[1] > y) && x < (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]) + a[0]) inside = !inside;
    }
    return inside;
  }

  draw(t) {
    const P = this.pos, n = this.n, r = this.r;
    let lx = Infinity, ly = Infinity, hx = -Infinity, hy = -Infinity, vx = 0, vy = 0;
    for (let i = 0; i < n; i++) {
      lx = Math.min(lx, P[i][0]); ly = Math.min(ly, P[i][1]);
      hx = Math.max(hx, P[i][0]); hy = Math.max(hy, P[i][1]);
      vx += P[i][0] - this.prev[i][0]; vy += P[i][1] - this.prev[i][1];
    }
    this.vx = vx / n / STEP; this.vy = vy / n / STEP; this.bottom = hy;
    this.centroid();
    const cx = this.cx, cy = this.cy, hw = (hx - lx) / 2, hh = (hy - ly) / 2;
    const sx = Math.min(1.6, hw / r), sy = Math.min(1.6, hh / r);
    const lookX = Math.max(-1, Math.min(1, this.vx / 1200)) * r * 0.07;
    const lookY = Math.max(-1, Math.min(1, this.vy / 1200)) * r * 0.07;

    // 影子：离地越高越小越淡
    const s = Math.max(0.35, 1 - (floorY - hy) / 500);
    ctx.fillStyle = `rgba(60,50,40,${0.16 * s})`;
    ctx.beginPath(); ctx.ellipse(cx, floorY, r * s * sx, r * 0.18 * s, 0, 0, Math.PI * 2); ctx.fill();

    // 身体：中点为端点、质点为控制点的平滑闭合曲线
    outline(P, n, r, this.style);
    const grad = ctx.createRadialGradient(cx - hw * 0.3, cy - hh * 0.4, r * 0.1, cx, cy, r * 1.15);
    grad.addColorStop(0, shade(this.color, -0.12));
    grad.addColorStop(1, this.color);
    ctx.fillStyle = grad; ctx.fill();
    ctx.lineWidth = Math.max(2.5, r * 0.05); ctx.lineJoin = 'round';
    ctx.strokeStyle = shade(this.color, 0.22); ctx.stroke();

    const ell = (x, y, w, h, rot, fill) => {
      ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, w), Math.max(0.1, h), rot, 0, Math.PI * 2);
      ctx.fillStyle = fill; ctx.fill();
    };
    // 高光
    ell(cx - hw * 0.4, cy - r * 0.48 * sy, r * 0.2 * sx, r * 0.11 * sy, -0.5, 'rgba(255,255,255,0.55)');

    if (t >= this.nextBlink) { this.blinkUntil = t + 0.12; this.nextBlink = t + 2 + Math.random() * 3; }
    const blink = t < this.blinkUntil ? 0.12 : 1;
    const eye = '#38251F';
    // 夜里睡觉；被戳、被拎、被弹起来会醒一会儿
    const asleep = env.night() > 0.6 && !this.held && t > this.excitedUntil + 4 && Math.hypot(this.vx, this.vy) < 200;
    for (const side of [-1, 1]) {
      ell(cx + side * r * 0.52 * sx + lookX * 0.5, cy + r * 0.04 * sy + lookY * 0.5, r * 0.1 * sx, r * 0.055 * sy, 0, 'rgba(255,115,128,0.38)');
      const ex = cx + side * r * 0.3 * sx + lookX, ey = cy - r * 0.2 * sy + lookY;
      if (asleep) {
        ctx.strokeStyle = eye; ctx.lineWidth = Math.max(1.5, r * 0.03); ctx.lineCap = 'round'; ctx.beginPath();
        ctx.moveTo(ex - r * 0.07 * sx, ey); ctx.quadraticCurveTo(ex, ey + r * 0.06 * sy, ex + r * 0.07 * sx, ey); ctx.stroke();
        continue;
      }
      ell(ex, ey, r * 0.075 * sx, r * 0.115 * sy * blink, 0, eye);
      if (blink === 1) ell(ex + r * 0.025, ey - r * 0.05 * sy, r * 0.035, r * 0.035, 0, '#fff');
    }
    if (asleep) {
      const ph = (t * 0.45 + this.r * 0.37) % 1;
      ctx.fillStyle = `rgba(235,230,250,${0.8 * (1 - ph)})`;
      ctx.font = `600 ${Math.round(r * 0.22 + ph * r * 0.12)}px -apple-system, sans-serif`;
      ctx.fillText('z', cx + r * (0.55 + ph * 0.25) * sx, cy - r * (0.75 + ph * 0.55));
    }
    const mx = cx + lookX, my = cy + r * 0.06 * sy + lookY;
    const excited = t < this.excitedUntil || Math.hypot(this.vx, this.vy) > 900;
    ctx.strokeStyle = eye; ctx.lineCap = 'round';
    if (excited) {
      ctx.beginPath(); ctx.ellipse(mx, my + r * 0.005, r * 0.065 * sx, r * 0.075 * sy, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#8C3338'; ctx.fill(); ctx.lineWidth = Math.max(1.5, r * 0.025); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(mx - r * 0.09 * sx, my);
      ctx.quadraticCurveTo(mx, my + r * 0.1 * sy, mx + r * 0.09 * sx, my);
      ctx.lineWidth = Math.max(2, r * 0.035); ctx.stroke();
    }
    // 头顶积雪：甩一甩就掉，不下雪时慢慢化掉
    if (Math.hypot(this.vx, this.vy) > 650) this.snow *= 0.85;
    if (env.weather !== 'snow' && env.season() !== 'winter') this.snow *= 0.995;
    if (this.snow > 0.03) {
      const top = P.reduce((a, p) => p[1] < a[1] ? p : a);
      ell(top[0], top[1] + r * 0.05, r * (0.12 + 0.4 * this.snow) * sx, r * (0.05 + 0.12 * this.snow), 0, 'rgba(255,255,255,0.96)');
    }
  }
}

// 各家庭成员的静止轮廓：返回该角度上的半径倍数（y 向下，-π/2 是头顶）
function restRadius(style, a) {
  if (style === 'drop') return 1 + 0.55 * Math.pow(Math.max(0, -Math.sin(a)), 10) - 0.06;
  if (style === 'flower') return 1 + 0.14 * Math.pow(Math.abs(Math.cos(3 * (a + Math.PI / 2))), 0.6) - 0.07;
  return 1;
}

function outline(P, n, r, style) {
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  ctx.beginPath();
  if (style === 'scallop' || style === 'spiky') {
    // 每两个质点一段：云朵边向外鼓一个小圆包，锯齿边向外顶一个小尖
    ctx.moveTo(P[0][0], P[0][1]);
    for (let i = 0; i < n; i += 2) {
      const a = P[i], b = P[(i + 2) % n], m = P[(i + 1) % n];
      const ex = b[0] - a[0], ey = b[1] - a[1], l = Math.hypot(ex, ey) || 1;
      const nx = ey / l, ny = -ex / l;
      if (style === 'scallop') {
        ctx.quadraticCurveTo(m[0] + nx * l * 0.55, m[1] + ny * l * 0.55, b[0], b[1]);
      } else {
        ctx.lineTo(m[0] + nx * r * 0.16, m[1] + ny * r * 0.16);
        ctx.lineTo(b[0], b[1]);
      }
    }
  } else {
    const m0 = mid(P[n - 1], P[0]);
    ctx.moveTo(m0[0], m0[1]);
    for (let i = 0; i < n; i++) {
      const m = mid(P[i], P[(i + 1) % n]);
      ctx.quadraticCurveTo(P[i][0], P[i][1], m[0], m[1]);
    }
  }
  ctx.closePath();
}

function collide(a, b) {
  const gap = Math.hypot(a.cx - b.cx, a.cy - b.cy);
  if (gap > (a.r + b.r) * 1.15) return;
  // 中心靠得太近（小的钻进了大的肚子里）：两个身体整体往反方向挪开一点
  const minGap = (a.r + b.r) * 0.7;
  if (gap < minGap) {
    let dx = a.cx - b.cx, dy = a.cy - b.cy;
    if (gap < 1e-3) { dx = 1; dy = 0; } else { dx /= gap; dy /= gap; }
    const shift = (minGap - gap) * 0.15, sa = b.r / (a.r + b.r), sb = a.r / (a.r + b.r);
    for (const p of a.pos) { p[0] += dx * shift * sa; p[1] += dy * shift * sa; }
    for (const p of b.pos) { p[0] -= dx * shift * sb; p[1] -= dy * shift * sb; }
    a.cx += dx * shift * sa; a.cy += dy * shift * sa;
    b.cx -= dx * shift * sb; b.cy -= dy * shift * sb;
  }
  push(a, b, b.r / (a.r + b.r)); push(b, a, a.r / (a.r + b.r));
}
function push(a, b, share) {
  const R = b.r * 0.95;
  for (const p of a.pos) {
    const dx = p[0] - b.cx, dy = p[1] - b.cy, l = Math.hypot(dx, dy);
    if (l >= R || l < 1e-6) continue;
    p[0] += dx / l * (R - l) * share; p[1] += dy / l * (R - l) * share;
  }
}

// 原创配色：一家五口
const family = [[80, '#FFB38A', 'smooth'], [62, '#8EDFB8', 'scallop'], [50, '#C3A6F2', 'drop'], [38, '#8CCBF5', 'spiky'], [30, '#FFE07A', 'flower']];
// 窄屏（手机竖屏）整家等比缩小
const sizeScale = Math.min(1, W / 600);
const blobs = family.map(([r, c, style], i) => new Blob(W * (0.15 + 0.17 * i), H * (0.45 - 0.07 * i), r * sizeScale, c, style));

let grab = null;

function step() {
  const a = tilt * 0.6, gx = Math.sin(a) * G + windNow(performance.now() / 1000) * 520, gy = Math.cos(a) * G;
  const shapeK = 0.03 * env.stiffness();
  for (const b of blobs) b.integrate(gx, gy);
  for (let it = 0; it < 4; it++) {
    if (grab) {
      // 捏住手指下那一小撮皮，其余部分被重力往下坠：拎起来是一颗水滴
      const b = grab.blob;
      for (let d = -2; d <= 2; d++) {
        const p = b.pos[(grab.idx + d + b.n) % b.n], w = [0.7, 0.35, 0.12][Math.abs(d)];
        p[0] += (grab.x - p[0]) * w; p[1] += (grab.y - p[1]) * w;
      }
    }
    for (const b of blobs) { b.solveShape(b.held ? 0.004 : shapeK); b.solveEdges(0.5); b.solvePressure(0.6); }
    for (let i = 0; i < blobs.length; i++) for (let j = i + 1; j < blobs.length; j++) collide(blobs[i], blobs[j]);
    for (const b of blobs) b.solveBounds();
  }
  for (const b of blobs) b.friction(0.15);
}

function familyHop(tx) {
  blobs.forEach((b, i) => setTimeout(() => {
    let vx = (Math.random() - 0.5) * 160;
    if (tx != null) vx += Math.max(-1, Math.min(1, (tx - b.cx) / 200)) * 260;
    b.impulse(vx, -(650 + Math.random() * 200));
    b.excitedUntil = performance.now() / 1000 + 0.5;
  }, i * 70));
}

function blobAt(x, y) {
  return [...blobs].sort((a, b) => a.r - b.r)
    .find(b => b.contains(x, y) || Math.hypot(b.cx - x, b.cy - y) < b.r * 0.8);
}

canvas.addEventListener('pointerdown', e => {
  const b = blobAt(e.clientX, e.clientY);
  if (!b) { familyHop(e.clientX); track('hop'); return; }
  let idx = 0, best = Infinity;
  b.pos.forEach((p, i) => { const d = Math.hypot(p[0] - e.clientX, p[1] - e.clientY); if (d < best) { best = d; idx = i; } });
  grab = { blob: b, x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t: performance.now(), idx, moved: false };
  b.excitedUntil = Infinity;
  try { canvas.setPointerCapture(e.pointerId); } catch {}
});
canvas.addEventListener('pointermove', e => {
  if (!grab) return;
  grab.x = e.clientX; grab.y = e.clientY;
  if (Math.hypot(grab.x - grab.sx, grab.y - grab.sy) > 12) { grab.moved = true; grab.blob.held = true; track('grab'); }
});
const release = e => {
  if (!grab) return;
  if (!grab.moved && performance.now() - grab.t < 300) { grab.blob.poke(e.clientX, e.clientY); track('poke'); }
  grab.blob.held = false;
  grab.blob.excitedUntil = performance.now() / 1000 + 0.6;
  grab = null;
};
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);

addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') tilt = -1;
  if (e.key === 'ArrowRight') tilt = 1;
  if (e.key === ' ') { familyHop(null); e.preventDefault(); }
});
addEventListener('keyup', e => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') tilt = 0; });
setTimeout(() => document.getElementById('hint').style.opacity = 0, 8000);

function drawGround() {
  const [fill, edge] = GROUND[env.season()].map(hex), n = env.night() * 0.35;
  ctx.fillStyle = rgb(mixRGB(fill, NIGHT, n)); ctx.fillRect(0, floorY, W, H - floorY);
  ctx.fillStyle = rgb(mixRGB(edge, NIGHT, n)); ctx.fillRect(0, floorY, W, 3);
}

let last = 0, acc = 0;
function frame(ms) {
  const t = ms / 1000;
  if (!last) last = t;
  const dt = Math.min(t - last, 1 / 20);
  acc += dt; last = t;
  let steps = 0;
  while (acc >= STEP && steps < 6) { step(); acc -= STEP; steps++; }
  drawSky(t);
  drawGround();
  for (const b of blobs) b.draw(t);
  updateParticles(dt, t);
  drawParticles(t, false);
  drawOverlay(t);
  drawParticles(t, true);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
<script>
// 访问统计（GoatCounter，无 cookie、不记录个人信息）：每次访问只记一次各类互动，以及页面停留时长的几个里程碑
const tracked = new Set();
function track(name) {
  if (tracked.has(name)) return;
  tracked.add(name);
  if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path: name, title: name, event: true });
}
let visibleSeconds = 0;
setInterval(() => {
  if (document.hidden) return;
  visibleSeconds += 5;
  for (const [s, name] of [[30, 'stay-30s'], [120, 'stay-2min'], [300, 'stay-5min']]) if (visibleSeconds >= s) track(name);
}, 5000);
</script>
