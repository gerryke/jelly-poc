<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>戳一戳果冻一家</title>
<meta name="description" content="一家五口的 Q 弹小果冻，拖一拖、戳一戳、看它们一起跳。">
<meta property="og:title" content="戳一戳果冻一家">
<meta property="og:description" content="一家五口的 Q 弹小果冻，拖一拖、戳一戳、看它们一起跳。">
<meta property="og:image" content="https://gerryke.github.io/jelly-poc/share.png">
<meta property="og:url" content="https://gerryke.github.io/jelly-poc/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #FFF6E8; overflow: hidden; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hint { position: fixed; top: 24px; width: 100%; text-align: center; color: #9A8878;
          font: 15px -apple-system, "PingFang SC", sans-serif; pointer-events: none; transition: opacity 1s; }
</style>
</head>
<body>
<img src="share.png" alt="" width="600" height="600" style="position:absolute;width:0;height:0;opacity:0;pointer-events:none">
<canvas id="c"></canvas>
<div id="hint">拖一拖 · 点一下戳它 · 点空白处一起跳 · ← → 倾斜 · 空格跳</div>
<script>
// 网页版原型：一圈 Verlet 质点 + 边长约束 + 内部气压 + 形状回弹（shape matching）
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, floorY = 0, world = {};
const STEP = 1 / 120, G = 1700;
let tilt = 0;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  floorY = H * 0.85;
  world = { minX: 6, maxX: W - 6, minY: 20, maxY: floorY };
}
addEventListener('resize', resize);
resize();

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = c => Math.round(c * (1 - amt));
  return `rgb(${f(n >> 16 & 255)},${f(n >> 8 & 255)},${f(n & 255)})`;
}

class Blob {
  constructor(x, y, r, color, style = 'smooth', n = 32) {
    this.n = n; this.r = r; this.color = color; this.style = style;
    this.unit = []; this.pos = []; this.prev = [];
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2, f = restRadius(style, a);
      this.unit.push([Math.cos(a) * f, Math.sin(a) * f]);
      this.pos.push([x + Math.cos(a) * f * r, y + Math.sin(a) * f * r]);
      this.prev.push([x + Math.cos(a) * f * r, y + Math.sin(a) * f * r]);
    }
    // 轮廓的质点重心挪到原点，否则形状回弹会一直把它往一个方向推
    let mx = 0, my = 0;
    for (const u of this.unit) { mx += u[0]; my += u[1]; }
    for (const u of this.unit) { u[0] -= mx / n; u[1] -= my / n; }
    // 静止轮廓的边长和面积（非圆形也能被气压和边约束维持）
    this.restEdge = []; let area = 0;
    for (let i = 0; i < n; i++) {
      const a = this.unit[i], b = this.unit[(i + 1) % n];
      this.restEdge.push(Math.hypot(b[0] - a[0], b[1] - a[1]));
      area += a[0] * b[1] - a[1] * b[0];
    }
    this.restAreaUnit = area * 0.5;
    this.held = false;
    this.cx = x; this.cy = y; this.vx = 0; this.vy = 0;
    this.excitedUntil = 0; this.nextBlink = 0; this.blinkUntil = 0;
    this.grounded = false;
  }
  get restArea() { return this.restAreaUnit * this.r * this.r; }

  integrate(gx, gy) {
    const max = this.r * 0.5;
    for (let i = 0; i < this.n; i++) {
      const p = this.pos[i], q = this.prev[i];
      const damp = this.held ? 0.99 : 0.998;
      let vx = (p[0] - q[0]) * damp, vy = (p[1] - q[1]) * damp;
      const l = Math.hypot(vx, vy);
      if (l > max) { vx *= max / l; vy *= max / l; }
      q[0] = p[0]; q[1] = p[1];
      p[0] += vx + gx * STEP * STEP; p[1] += vy + gy * STEP * STEP;
    }
  }
  centroid() {
    let x = 0, y = 0;
    for (const p of this.pos) { x += p[0]; y += p[1]; }
    this.cx = x / this.n; this.cy = y / this.n;
  }
  solveShape(k) {
    this.centroid();
    let s = 0, c = 0;
    for (let i = 0; i < this.n; i++) {
      const u = this.unit[i], dx = this.pos[i][0] - this.cx, dy = this.pos[i][1] - this.cy;
      c += u[0] * dx + u[1] * dy; s += u[0] * dy - u[1] * dx;
    }
    const a = Math.atan2(s, c) * (this.held ? 1 : 0.97), ca = Math.cos(a), sa = Math.sin(a);
    for (let i = 0; i < this.n; i++) {
      const ux = this.unit[i][0] * this.r, uy = this.unit[i][1] * this.r;
      const gx = this.cx + ux * ca - uy * sa, gy = this.cy + ux * sa + uy * ca;
      this.pos[i][0] += (gx - this.pos[i][0]) * k;
      this.pos[i][1] += (gy - this.pos[i][1]) * k;
    }
  }
  solveEdges(k) {
    for (let i = 0; i < this.n; i++) {
      const rest = this.restEdge[i] * this.r;
      const a = this.pos[i], b = this.pos[(i + 1) % this.n];
      const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy);
      if (l < 1e-9) continue;
      const f = (l - rest) / l * 0.5 * k;
      a[0] += dx * f; a[1] += dy * f; b[0] -= dx * f; b[1] -= dy * f;
    }
  }
  solvePressure(k) {
    let area = 0, per = 0;
    for (let i = 0; i < this.n; i++) {
      const a = this.pos[i], b = this.pos[(i + 1) % this.n];
      area += a[0] * b[1] - a[1] * b[0];
      per += Math.hypot(b[0] - a[0], b[1] - a[1]);
    }
    area *= 0.5;
    const push = (this.restArea - area) / per * k;
    const old = this.pos.map(p => [p[0], p[1]]);
    for (let i = 0; i < this.n; i++) {
      const nx = old[(i + 1) % this.n], pv = old[(i + this.n - 1) % this.n];
      let tx = nx[0] - pv[0], ty = nx[1] - pv[1];
      const l = Math.hypot(tx, ty) || 1;
      this.pos[i][0] += ty / l * push; this.pos[i][1] += -tx / l * push;
    }
  }
  solveBounds() {
    for (const p of this.pos) {
      p[0] = Math.min(Math.max(p[0], world.minX), world.maxX);
      p[1] = Math.min(Math.max(p[1], world.minY), world.maxY);
    }
  }
  friction(amt) {
    for (let i = 0; i < this.n; i++) {
      const p = this.pos[i], q = this.prev[i];
      if (p[1] >= world.maxY - 0.5 || p[1] <= world.minY + 0.5) q[0] += (p[0] - q[0]) * amt;
      if (p[0] <= world.minX + 0.5 || p[0] >= world.maxX - 0.5) q[1] += (p[1] - q[1]) * amt;
    }
  }
  impulse(vx, vy) {
    for (const q of this.prev) { q[0] -= vx * STEP; q[1] -= vy * STEP; }
  }
  poke(x, y) {
    this.centroid();
    const reach = this.r * 0.9;
    for (const p of this.pos) {
      const d = Math.hypot(p[0] - x, p[1] - y);
      if (d >= reach) continue;
      const f = 1 - d / reach, dx = this.cx - p[0], dy = this.cy - p[1], l = Math.hypot(dx, dy) || 1;
      p[0] += dx / l * this.r * 0.35 * f; p[1] += dy / l * this.r * 0.35 * f;
    }
    const side = Math.max(-1, Math.min(1, (this.cx - x) / this.r));
    this.impulse(side * 260, -760);
  }
  contains(x, y) {
    let inside = false;
    for (let i = 0, j = this.n - 1; i < this.n; j = i++) {
      const a = this.pos[i], b = this.pos[j];
      if ((a[1] > y) !== (b[1] > y) && x < (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]) + a[0]) inside = !inside;
    }
    return inside;
  }

  draw(t) {
    const P = this.pos, n = this.n, r = this.r;
    let lx = Infinity, ly = Infinity, hx = -Infinity, hy = -Infinity, vx = 0, vy = 0;
    for (let i = 0; i < n; i++) {
      lx = Math.min(lx, P[i][0]); ly = Math.min(ly, P[i][1]);
      hx = Math.max(hx, P[i][0]); hy = Math.max(hy, P[i][1]);
      vx += P[i][0] - this.prev[i][0]; vy += P[i][1] - this.prev[i][1];
    }
    this.vx = vx / n / STEP; this.vy = vy / n / STEP; this.bottom = hy;
    this.centroid();
    const cx = this.cx, cy = this.cy, hw = (hx - lx) / 2, hh = (hy - ly) / 2;
    const sx = Math.min(1.6, hw / r), sy = Math.min(1.6, hh / r);
    const lookX = Math.max(-1, Math.min(1, this.vx / 1200)) * r * 0.07;
    const lookY = Math.max(-1, Math.min(1, this.vy / 1200)) * r * 0.07;

    // 影子：离地越高越小越淡
    const s = Math.max(0.35, 1 - (floorY - hy) / 500);
    ctx.fillStyle = `rgba(60,50,40,${0.16 * s})`;
    ctx.beginPath(); ctx.ellipse(cx, floorY, r * s * sx, r * 0.18 * s, 0, 0, Math.PI * 2); ctx.fill();

    // 身体：中点为端点、质点为控制点的平滑闭合曲线
    outline(P, n, r, this.style);
    const grad = ctx.createRadialGradient(cx - hw * 0.3, cy - hh * 0.4, r * 0.1, cx, cy, r * 1.15);
    grad.addColorStop(0, shade(this.color, -0.12));
    grad.addColorStop(1, this.color);
    ctx.fillStyle = grad; ctx.fill();
    ctx.lineWidth = Math.max(2.5, r * 0.05); ctx.lineJoin = 'round';
    ctx.strokeStyle = shade(this.color, 0.22); ctx.stroke();

    const ell = (x, y, w, h, rot, fill) => {
      ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, w), Math.max(0.1, h), rot, 0, Math.PI * 2);
      ctx.fillStyle = fill; ctx.fill();
    };
    // 高光
    ell(cx - hw * 0.4, cy - r * 0.48 * sy, r * 0.2 * sx, r * 0.11 * sy, -0.5, 'rgba(255,255,255,0.55)');

    if (t >= this.nextBlink) { this.blinkUntil = t + 0.12; this.nextBlink = t + 2 + Math.random() * 3; }
    const blink = t < this.blinkUntil ? 0.12 : 1;
    const eye = '#38251F';
    for (const side of [-1, 1]) {
      ell(cx + side * r * 0.52 * sx + lookX * 0.5, cy + r * 0.04 * sy + lookY * 0.5, r * 0.1 * sx, r * 0.055 * sy, 0, 'rgba(255,115,128,0.38)');
      const ex = cx + side * r * 0.3 * sx + lookX, ey = cy - r * 0.2 * sy + lookY;
      ell(ex, ey, r * 0.075 * sx, r * 0.115 * sy * blink, 0, eye);
      if (blink === 1) ell(ex + r * 0.025, ey - r * 0.05 * sy, r * 0.035, r * 0.035, 0, '#fff');
    }
    const mx = cx + lookX, my = cy + r * 0.06 * sy + lookY;
    const excited = t < this.excitedUntil || Math.hypot(this.vx, this.vy) > 900;
    ctx.strokeStyle = eye; ctx.lineCap = 'round';
    if (excited) {
      ctx.beginPath(); ctx.ellipse(mx, my + r * 0.005, r * 0.065 * sx, r * 0.075 * sy, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#8C3338'; ctx.fill(); ctx.lineWidth = Math.max(1.5, r * 0.025); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(mx - r * 0.09 * sx, my);
      ctx.quadraticCurveTo(mx, my + r * 0.1 * sy, mx + r * 0.09 * sx, my);
      ctx.lineWidth = Math.max(2, r * 0.035); ctx.stroke();
    }
  }
}

// 各家庭成员的静止轮廓：返回该角度上的半径倍数（y 向下，-π/2 是头顶）
function restRadius(style, a) {
  if (style === 'drop') return 1 + 0.55 * Math.pow(Math.max(0, -Math.sin(a)), 10) - 0.06;
  if (style === 'flower') return 1 + 0.14 * Math.pow(Math.abs(Math.cos(3 * (a + Math.PI / 2))), 0.6) - 0.07;
  return 1;
}

function outline(P, n, r, style) {
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  ctx.beginPath();
  if (style === 'scallop' || style === 'spiky') {
    // 每两个质点一段：云朵边向外鼓一个小圆包，锯齿边向外顶一个小尖
    ctx.moveTo(P[0][0], P[0][1]);
    for (let i = 0; i < n; i += 2) {
      const a = P[i], b = P[(i + 2) % n], m = P[(i + 1) % n];
      const ex = b[0] - a[0], ey = b[1] - a[1], l = Math.hypot(ex, ey) || 1;
      const nx = ey / l, ny = -ex / l;
      if (style === 'scallop') {
        ctx.quadraticCurveTo(m[0] + nx * l * 0.55, m[1] + ny * l * 0.55, b[0], b[1]);
      } else {
        ctx.lineTo(m[0] + nx * r * 0.16, m[1] + ny * r * 0.16);
        ctx.lineTo(b[0], b[1]);
      }
    }
  } else {
    const m0 = mid(P[n - 1], P[0]);
    ctx.moveTo(m0[0], m0[1]);
    for (let i = 0; i < n; i++) {
      const m = mid(P[i], P[(i + 1) % n]);
      ctx.quadraticCurveTo(P[i][0], P[i][1], m[0], m[1]);
    }
  }
  ctx.closePath();
}

function collide(a, b) {
  const gap = Math.hypot(a.cx - b.cx, a.cy - b.cy);
  if (gap > (a.r + b.r) * 1.15) return;
  // 中心靠得太近（小的钻进了大的肚子里）：两个身体整体往反方向挪开一点
  const minGap = (a.r + b.r) * 0.7;
  if (gap < minGap) {
    let dx = a.cx - b.cx, dy = a.cy - b.cy;
    if (gap < 1e-3) { dx = 1; dy = 0; } else { dx /= gap; dy /= gap; }
    const shift = (minGap - gap) * 0.15, sa = b.r / (a.r + b.r), sb = a.r / (a.r + b.r);
    for (const p of a.pos) { p[0] += dx * shift * sa; p[1] += dy * shift * sa; }
    for (const p of b.pos) { p[0] -= dx * shift * sb; p[1] -= dy * shift * sb; }
    a.cx += dx * shift * sa; a.cy += dy * shift * sa;
    b.cx -= dx * shift * sb; b.cy -= dy * shift * sb;
  }
  push(a, b, b.r / (a.r + b.r)); push(b, a, a.r / (a.r + b.r));
}
function push(a, b, share) {
  const R = b.r * 0.95;
  for (const p of a.pos) {
    const dx = p[0] - b.cx, dy = p[1] - b.cy, l = Math.hypot(dx, dy);
    if (l >= R || l < 1e-6) continue;
    p[0] += dx / l * (R - l) * share; p[1] += dy / l * (R - l) * share;
  }
}

// 原创配色：一家五口
const family = [[80, '#FFB38A', 'smooth'], [62, '#8EDFB8', 'scallop'], [50, '#C3A6F2', 'drop'], [38, '#8CCBF5', 'spiky'], [30, '#FFE07A', 'flower']];
// 窄屏（手机竖屏）整家等比缩小
const sizeScale = Math.min(1, W / 600);
const blobs = family.map(([r, c, style], i) => new Blob(W * (0.15 + 0.17 * i), H * (0.45 - 0.07 * i), r * sizeScale, c, style));

let grab = null;

function step() {
  const a = tilt * 0.6, gx = Math.sin(a) * G, gy = Math.cos(a) * G;
  for (const b of blobs) b.integrate(gx, gy);
  for (let it = 0; it < 4; it++) {
    if (grab) {
      // 捏住手指下那一小撮皮，其余部分被重力往下坠：拎起来是一颗水滴
      const b = grab.blob;
      for (let d = -2; d <= 2; d++) {
        const p = b.pos[(grab.idx + d + b.n) % b.n], w = [0.7, 0.35, 0.12][Math.abs(d)];
        p[0] += (grab.x - p[0]) * w; p[1] += (grab.y - p[1]) * w;
      }
    }
    for (const b of blobs) { b.solveShape(b.held ? 0.004 : 0.03); b.solveEdges(0.5); b.solvePressure(0.6); }
    for (let i = 0; i < blobs.length; i++) for (let j = i + 1; j < blobs.length; j++) collide(blobs[i], blobs[j]);
    for (const b of blobs) b.solveBounds();
  }
  for (const b of blobs) b.friction(0.15);
}

function familyHop(tx) {
  blobs.forEach((b, i) => setTimeout(() => {
    let vx = (Math.random() - 0.5) * 160;
    if (tx != null) vx += Math.max(-1, Math.min(1, (tx - b.cx) / 200)) * 260;
    b.impulse(vx, -(650 + Math.random() * 200));
    b.excitedUntil = performance.now() / 1000 + 0.5;
  }, i * 70));
}

function blobAt(x, y) {
  return [...blobs].sort((a, b) => a.r - b.r)
    .find(b => b.contains(x, y) || Math.hypot(b.cx - x, b.cy - y) < b.r * 0.8);
}

canvas.addEventListener('pointerdown', e => {
  const b = blobAt(e.clientX, e.clientY);
  if (!b) { familyHop(e.clientX); track('hop'); return; }
  let idx = 0, best = Infinity;
  b.pos.forEach((p, i) => { const d = Math.hypot(p[0] - e.clientX, p[1] - e.clientY); if (d < best) { best = d; idx = i; } });
  grab = { blob: b, x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t: performance.now(), idx, moved: false };
  b.excitedUntil = Infinity;
  try { canvas.setPointerCapture(e.pointerId); } catch {}
});
canvas.addEventListener('pointermove', e => {
  if (!grab) return;
  grab.x = e.clientX; grab.y = e.clientY;
  if (Math.hypot(grab.x - grab.sx, grab.y - grab.sy) > 12) { grab.moved = true; grab.blob.held = true; track('grab'); }
});
const release = e => {
  if (!grab) return;
  if (!grab.moved && performance.now() - grab.t < 300) { grab.blob.poke(e.clientX, e.clientY); track('poke'); }
  grab.blob.held = false;
  grab.blob.excitedUntil = performance.now() / 1000 + 0.6;
  grab = null;
};
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);

addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') tilt = -1;
  if (e.key === 'ArrowRight') tilt = 1;
  if (e.key === ' ') { familyHop(null); e.preventDefault(); }
});
addEventListener('keyup', e => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') tilt = 0; });
if (matchMedia('(pointer: coarse)').matches) document.getElementById('hint').textContent = '拖一拖 · 戳一戳 · 点空白处一起跳';
setTimeout(() => document.getElementById('hint').style.opacity = 0, 8000);

function drawGround() {
  ctx.fillStyle = '#C8E6B0'; ctx.fillRect(0, floorY, W, H - floorY);
  ctx.fillStyle = '#A9D38C'; ctx.fillRect(0, floorY, W, 3);
}

let last = 0, acc = 0;
function frame(ms) {
  const t = ms / 1000;
  if (!last) last = t;
  acc += Math.min(t - last, 1 / 20); last = t;
  let steps = 0;
  while (acc >= STEP && steps < 6) { step(); acc -= STEP; steps++; }
  ctx.fillStyle = '#FFF6E8'; ctx.fillRect(0, 0, W, H);
  drawGround();
  for (const b of blobs) b.draw(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
<script>
// 访问统计（GoatCounter，无 cookie、不记录个人信息）：每次访问只记一次各类互动，以及页面停留时长的几个里程碑
const tracked = new Set();
function track(name) {
  if (tracked.has(name)) return;
  tracked.add(name);
  if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path: name, title: name, event: true });
}
let visibleSeconds = 0;
setInterval(() => {
  if (document.hidden) return;
  visibleSeconds += 5;
  for (const [s, name] of [[30, 'stay-30s'], [120, 'stay-2min'], [300, 'stay-5min']]) if (visibleSeconds >= s) track(name);
}, 5000);
</script>
<script data-goatcounter="https://gerryke.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
